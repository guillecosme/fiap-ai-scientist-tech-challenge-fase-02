[project]
name = "alfabetizacao-pipeline"
version = "0.1.0"
description = "Pipeline hibrida (batch + streaming) em arquitetura medalhao para o Indicador Crianca Alfabetizada"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyspark>=3.5.0",
    "boto3>=1.34.0",
    "basedosdados>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "awscli-local>=0.22",
    "moto>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
